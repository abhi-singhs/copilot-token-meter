# Copilot token meter tmux status example
# See https://github.com/abhi-singhs/copilot-token-meter
#
# Requires jq.
# Install by copying this file to ~/.tmux-tokenmeter.conf and adding this to
# ~/.tmux.conf:
#
#   source-file ~/.tmux-tokenmeter.conf
#
# The plugin writes ~/.copilot/state/token-meter/latest.json.

set -g status-interval 2

# Simplest version: show the same one-line title that the plugin uses.
set -g status-right '#(cat ~/.copilot/state/token-meter/latest.json 2>/dev/null | jq -r ".title // empty")'
set -ag status-right ' | %H:%M'

# Fancier version: uncomment this block to also show context utilization.
# set -g status-right '#(cat ~/.copilot/state/token-meter/latest.json 2>/dev/null | jq -r ".title // empty")'
