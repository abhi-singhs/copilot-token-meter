; Copilot token meter Polybar module example
; See https://github.com/abhi-singhs/copilot-token-meter
;
; Requires jq.
; Add the module to your bar, for example:
;
;   modules-right = copilot-tokens date
;
; The plugin writes ~/.copilot/state/token-meter/latest.json.

[module/copilot-tokens]
type = custom/script
exec = cat ~/.copilot/state/token-meter/latest.json 2>/dev/null | jq -r '.title // empty'
interval = 2
format = <label>
label = %output%
